# This file may be used to create an environment using:
# $ conda env create --file <this file>
# platform: linux-64
name: hj_env
channels:
  - pytorch
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # --- system base ---
  - _libgcc_mutex=0.1
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2024.2.2
  - certifi=2024.6.2
  - ld_impl_linux-64=2.40
  - libffi=3.4.2
  - libgcc-ng=13.2.0
  - libgomp=13.2.0
  - libnsl=2.0.1
  - libsqlite=3.45.3
  - libuuid=2.38.1
  - libxcrypt=4.4.36
  - libzlib=1.3.1
  - ncurses=6.5
  - openssl=3.3.0
  - readline=8.2
  - tk=8.6.13
  - xz=5.2.6
  - yaml=0.2.5
  - zlib
  # --- Python & tools ---
  - python=3.10.14
  - pip=24.0
  - setuptools=70.0.0
  - wheel=0.43.0
  - typing-extensions=4.12
  - pyyaml=6.0
  - requests=2.32
  - tqdm=4.66
  - tabulate=0.9
  - pillow=10.3
  - skorch=0.15.0
  # --- math & ML ---
  - numpy=1.25
  - pandas=1.5
  - scipy=1.13
  - scikit-learn=1.3
  - joblib=1.4
  - threadpoolctl=3.5
  - python-dateutil
  - pytz=2024.1
  - charset-normalizer=3.3.2
  - idna=3.7
  - six=1.16.0
  # --- Deep Learning (CUDA 11.6) ---
  - pytorch=1.12.1
  - torchvision=0.13.1
  - torchaudio=0.12.1
  - cudatoolkit=11.6

 